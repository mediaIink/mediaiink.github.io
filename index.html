<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediaLink</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: #050505;
        color: #f8fafc;
        font-family: "Outfit", sans-serif;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        position: relative;
      }

      .animated-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: linear-gradient(120deg, #050505, #111827, #020617, #050505);
        background-size: 300% 300%;
        animation: gradientShift 12s ease infinite;
        z-index: -1;
      }

      @keyframes gradientShift {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      .brand {
        position: absolute;
        top: 40px;
        left: 50px;
        font-size: 1.25rem;
        font-weight: 500;
        letter-spacing: 0.05em;
        color: #cbd5e1;
        opacity: 0;
        transition:
          opacity 1s ease,
          color 0.3s ease;
        cursor: pointer;
      }

      .brand:hover {
        color: #f8fafc;
      }

      #loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        transition: opacity 0.5s ease;
      }

      .spinner {
        width: 30px;
        height: 30px;
        border: 2px solid rgba(255, 255, 255, 0.05);
        border-top-color: #cbd5e1;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      #content {
        text-align: center;
        max-width: 500px;
        width: 100%;
        padding: 0 20px;
        opacity: 0;
        transform: translateY(15px);
        transition:
          opacity 0.8s ease,
          transform 0.8s ease;
        pointer-events: none;
      }

      #content.visible {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
      }

      .brand.visible {
        opacity: 1;
      }

      h1 {
        font-size: 2.25rem;
        font-weight: 500;
        margin-bottom: 1rem;
        color: #f8fafc;
      }

      p {
        font-size: 1.1rem;
        font-weight: 300;
        color: #94a3b8;
        line-height: 1.6;
      }

      .upload-wrapper {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
        width: 100%;
      }

      .drop-zone {
        width: 100%;
        height: 140px;
        border: 2px dashed #475569;
        border-radius: 12px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: all 0.3s ease;
        color: #94a3b8;
        background-color: rgba(255, 255, 255, 0.02);
      }

      .drop-zone:hover,
      .drop-zone.dragover {
        border-color: #cbd5e1;
        background-color: rgba(255, 255, 255, 0.05);
        color: #f8fafc;
      }

      .btn {
        background-color: #cbd5e1;
        color: #0f172a;
        border: none;
        padding: 12px 28px;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 500;
        cursor: pointer;
        transition:
          background-color 0.3s ease,
          transform 0.1s ease;
        font-family: inherit;
        margin-top: 1.5rem;
      }

      .btn:hover:not(:disabled) {
        background-color: #f8fafc;
      }

      .btn:active:not(:disabled) {
        transform: scale(0.98);
      }

      .btn:disabled {
        background-color: #334155;
        color: #94a3b8;
        cursor: not-allowed;
      }

      .link-output {
        display: none;
        width: 100%;
        margin-top: 10px;
        background-color: rgba(0, 0, 0, 0.4);
        border: 1px solid #334155;
        border-radius: 8px;
        padding: 12px;
      }

      .link-output input {
        width: 100%;
        background: transparent;
        border: none;
        color: #cbd5e1;
        font-size: 0.95rem;
        font-family: inherit;
        outline: none;
        text-align: center;
      }

      #error-view {
        display: none;
        flex-direction: column;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <div class="animated-bg"></div>

    <div class="brand" id="brand-name">MediaLink</div>

    <div id="loader">
      <div class="spinner"></div>
    </div>

    <main id="content">
      <div id="error-view">
        <h1>Le lien est invalide.</h1>
        <p>
          La page que vous essayez de rejoindre n'existe plus ou l'URL est
          incorrecte. Veuillez vérifier l'adresse ou demander un nouveau lien
          d'accès.
        </p>
        <button class="btn" id="home-btn">Retour à l'accueil</button>
      </div>

      <div id="upload-view" class="upload-wrapper">
        <div>
          <h1>Partage de fichiers</h1>
          <p>Déposez vos fichiers ici pour générer un lien de partage.</p>
        </div>

        <div class="drop-zone" id="drop-zone">
          <span>Cliquez ou glissez vos fichiers ici</span>
        </div>

        <input type="file" id="file-input" style="display: none" multiple />

        <button class="btn" id="generate-btn" disabled>Générer le lien</button>

        <div class="link-output" id="link-output">
          <input type="text" id="fake-link" readonly />
        </div>
      </div>
    </main>

    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const pageId = urlParams.get("id");

      if (pageId) {
        document.title = `MediaLink - ${pageId}`;
      }

      const fakeLoadingTime = 500;

      function goHome() {
        window.location.href = window.location.pathname;
      }

      document.addEventListener("DOMContentLoaded", () => {
        const loader = document.getElementById("loader");
        const content = document.getElementById("content");
        const brand = document.getElementById("brand-name");

        const errorView = document.getElementById("error-view");
        const uploadView = document.getElementById("upload-view");
        const homeBtn = document.getElementById("home-btn");

        brand.addEventListener("click", goHome);
        homeBtn.addEventListener("click", goHome);

        if (pageId) {
          errorView.style.display = "flex";
        } else {
          uploadView.style.display = "flex";
          initUploadFeatures();
        }

        setTimeout(() => {
          loader.style.opacity = "0";

          setTimeout(() => {
            loader.style.display = "none";
            content.classList.add("visible");
            brand.classList.add("visible");
          }, 500);
        }, fakeLoadingTime);
      });

      function initUploadFeatures() {
        const dropZone = document.getElementById("drop-zone");
        const fileInput = document.getElementById("file-input");
        const generateBtn = document.getElementById("generate-btn");
        const linkOutput = document.getElementById("link-output");
        const fakeLinkInput = document.getElementById("fake-link");

        let fileReady = false;

        dropZone.addEventListener("click", () => {
          fileInput.click();
        });

        dropZone.addEventListener("dragover", (e) => {
          e.preventDefault();
          dropZone.classList.add("dragover");
        });

        dropZone.addEventListener("dragleave", () => {
          dropZone.classList.remove("dragover");
        });

        dropZone.addEventListener("drop", (e) => {
          e.preventDefault();
          dropZone.classList.remove("dragover");
          if (e.dataTransfer.files.length > 0) {
            updateDropZone(e.dataTransfer.files.length);
          }
        });

        fileInput.addEventListener("change", (e) => {
          if (e.target.files.length > 0) {
            updateDropZone(e.target.files.length);
          }
        });

        function updateDropZone(count) {
          dropZone.innerHTML = `<span>${count} fichier(s) prêt(s) à être partagé(s)</span>`;
          dropZone.style.borderColor = "#cbd5e1";
          generateBtn.disabled = false;
          fileReady = true;
          linkOutput.style.display = "none";
        }

        generateBtn.addEventListener("click", () => {
          if (!fileReady) return;

          const randomId = Math.random().toString(36).substring(2, 10);

          const baseUrl = window.location.href.split("?")[0];
          const generatedUrl = `${baseUrl}?id=${randomId}`;

          fakeLinkInput.value = generatedUrl;
          linkOutput.style.display = "block";

          fakeLinkInput.select();

          generateBtn.textContent = "Lien généré !";
          setTimeout(() => {
            generateBtn.textContent = "Générer le lien";
          }, 2000);
        });
      }
    </script>
  </body>
</html>
